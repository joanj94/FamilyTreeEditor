<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FamilyTreeEditor</title>
    <!-- Inline rather than a file: the browser asks for /favicon.ico on every load and logs a 404
         when there is none, and a bundle that carries its own icon has one less thing to deploy. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cg fill='none' stroke='%23555' stroke-width='1.2'%3E%3Cpath d='M8 4.5v3M4 12v-2.5h8V12'/%3E%3C/g%3E%3Cg fill='%23888'%3E%3Crect x='5.5' y='1.5' width='5' height='3' rx='.5'/%3E%3Crect x='1.5' y='12' width='5' height='3' rx='.5'/%3E%3Crect x='9.5' y='12' width='5' height='3' rx='.5'/%3E%3C/g%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="Open, view, edit and export GEDCOM family trees. Files are parsed in your browser and never uploaded."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
